name: Edgeform Midnight Scraper & Refresh

on:
  schedule:
    # Runs every day at 23:00 UTC (12:00 Midnight WAT)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SportyBet Scraper & Quantitative Model
        run: |
          python scraper.py

      - name: Commit and push fresh JSON dataset
        run: |
          git config --global user.name "Edgeform Auto-Bot"
          git config --global user.email "bot@edgeform.site"
          git add fixtures.json
          git commit -m "Automated midnight SportyBet scrape: $(date +'%Y-%m-%d')" || exit 0
          git push
